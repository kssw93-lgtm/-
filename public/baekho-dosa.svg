<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="백호도사">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2a2038"/>
      <stop offset="100%" stop-color="#150f1e"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2f16"/>
      <stop offset="100%" stop-color="#1c1608"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c15c"/>
      <stop offset="100%" stop-color="#fbe7a8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c15c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8c15c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="520" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="150" fill="url(#halo)"/>

  <!-- 지팡이 -->
  <g stroke="#caa24a" stroke-width="6" stroke-linecap="round">
    <line x1="298" y1="150" x2="330" y2="470"/>
  </g>
  <circle cx="296" cy="140" r="14" fill="url(#gold)"/>

  <!-- 로브(하단) -->
  <path d="M120 330 C110 400 100 470 96 500 L304 500 C300 470 292 400 280 330 Z" fill="url(#robe)"/>
  <path d="M150 340 C150 400 150 460 150 500 M200 335 C200 400 200 460 200 500 M250 340 C250 400 250 460 250 500"
        stroke="#4a3b1c" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M120 330 C160 345 240 345 280 330" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- 옷깃/장식 매듭 -->
  <circle cx="200" cy="352" r="10" fill="url(#gold)"/>
  <path d="M190 352 L170 400 M210 352 L230 400" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

  <!-- 몸통 -->
  <path d="M130 260 C130 210 160 185 200 185 C240 185 270 210 270 260 L272 340 C240 355 160 355 128 340 Z" fill="#f4efe4"/>
  <path d="M150 210 L160 250 M180 195 L190 250 M210 195 L220 250 M250 210 L240 250" stroke="#1c1c1c" stroke-width="7" stroke-linecap="round"/>

  <!-- 팔(왼쪽, 지팡이를 쥔 손) -->
  <path d="M258 230 C285 245 300 270 300 300" stroke="#f4efe4" stroke-width="26" stroke-linecap="round" fill="none"/>
  <circle cx="300" cy="300" r="15" fill="#f4efe4"/>

  <!-- 팔(오른쪽, 지혜의 손짓) -->
  <path d="M148 235 C120 250 108 280 118 305" stroke="#f4efe4" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="120" cy="300" r="14" fill="#f4efe4"/>

  <!-- 갓(모자) -->
  <ellipse cx="200" cy="118" rx="86" ry="14" fill="#1a1a1a"/>
  <path d="M156 118 C156 78 170 56 200 56 C230 56 244 78 244 118 Z" fill="#1a1a1a"/>
  <ellipse cx="200" cy="118" rx="70" ry="10" fill="#2a2a2a"/>
  <rect x="192" y="52" width="16" height="16" rx="3" fill="#1a1a1a"/>

  <!-- 얼굴(백호) -->
  <ellipse cx="200" cy="160" rx="62" ry="56" fill="#faf6ec"/>
  <path d="M150 130 C140 108 148 90 168 96 C168 112 164 122 150 130 Z" fill="#faf6ec"/>
  <path d="M250 130 C260 108 252 90 232 96 C232 112 236 122 250 130 Z" fill="#faf6ec"/>
  <path d="M155 112 C150 100 154 92 164 96 M245 112 C250 100 246 92 236 96" stroke="#1c1c1c" stroke-width="3" fill="none"/>

  <!-- 줄무늬 -->
  <path d="M150 140 C160 136 170 138 176 144 M148 158 C160 155 172 156 180 162 M155 178 C166 176 176 180 182 186"
