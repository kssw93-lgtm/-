  <path d="M250 140 C240 136 230 138 224 144 M252 158 C240 155 228 156 220 162 M245 178 C234 176 224 180 218 186"
        stroke="#1c1c1c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- 이목구비 -->
  <path d="M172 152 C178 146 188 146 192 152" stroke="#1c1c1c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M208 152 C212 146 222 146 228 152" stroke="#1c1c1c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="182" cy="154" r="5" fill="#1c1c1c"/>
  <circle cx="218" cy="154" r="5" fill="#1c1c1c"/>
  <path d="M196 164 L200 178 L192 182" stroke="#e2a4a4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M170 196 C185 208 215 208 230 196" stroke="#1c1c1c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M188 200 C192 206 208 206 212 200" stroke="#c0403a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 수염 -->
  <g stroke="#d8d0c0" stroke-width="3" stroke-linecap="round">
    <line x1="176" y1="188" x2="140" y2="182"/>
    <line x1="176" y1="196" x2="138" y2="198"/>
    <line x1="224" y1="188" x2="260" y2="182"/>
    <line x1="224" y1="196" x2="262" y2="198"/>
  </g>

  <!-- 하단 라벨 -->
  <text x="200" y="500" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="0" opacity="0"> </text>
</svg>
